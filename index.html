<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Метка — дизайнер и печать этикеток для термопринтеров Niimbot прямо в браузере."
    />
    <title>Метка — этикетки Niimbot</title>
    <script>
      ;(function () {
        var theme = localStorage.getItem('metka.theme')
        if (theme !== 'light' && theme !== 'dim') theme = 'dark'
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <style>
      html[data-theme='light'] { color-scheme: light; }
      html[data-theme='dark'],
      html[data-theme='dim'] { color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
